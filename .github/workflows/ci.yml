name: OpenFAIR-Mat CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest with coverage threshold (>= 85%)
        run: |
          pytest --cov=openfair_mat --cov-report=term-missing --cov-fail-under=85

      - name: Verify CLI passes on valid public fixtures
        run: |
          mkdir -p /tmp/openfair_valid_out
          openfair-check fixtures/valid -o /tmp/openfair_valid_out
          test -f /tmp/openfair_valid_out/ro-crate-metadata.json
          test -f /tmp/openfair_valid_out/repro-manifest.json

      - name: Verify CLI exits non-zero on corrupted fixtures
        run: |
          mkdir -p /tmp/openfair_invalid_out
          set +e
          openfair-check fixtures/invalid -o /tmp/openfair_invalid_out
          rc=$?
          set -e
          test "$rc" -ne 0
          test -f /tmp/openfair_invalid_out/repro-manifest.json
